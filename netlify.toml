[build]
  publish = "dist"
  command = "npm run build"

# SPA Fallback for client-side routing on Netlify
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Cache static assets for ultra-fast loading across all devices
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "ALLOWALL"
    Access-Control-Allow-Origin = "*"
